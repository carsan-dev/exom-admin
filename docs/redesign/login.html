<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iniciar sesión · EXOM Admin</title>
  <link rel="icon" href="assets/exom-balance.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/barlow-800.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="assets/system.css">
  <link rel="stylesheet" href="assets/pages/login.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script src="assets/proto.js"></script>
</head>
<body class="auth-body" data-auth="login">
<a class="skip-link" href="#auth-main">Saltar al contenido</a>
<div class="auth-frame">

  <div class="auth-brand">
    <div class="auth-rules" aria-hidden="true"><span class="auth-rule r1"></span><span class="auth-rule r2"></span></div>
    <span class="auth-mark" aria-hidden="true">E<span>X</span>OM</span>
    <p class="auth-tagline">
      <svg class="brand-symbol" viewBox="0 0 120 112" aria-hidden="true" focusable="false"><path class="half-a" d="M46 110C20 106 0 84 0 56C0 33 14 12 35 3C48-2 60 4 62 16C66 29 57 39 44 39C36 39 28 35 23 28C11 38 5 51 7 65C9 86 24 103 46 109Z"/><path class="half-b" transform="rotate(180 60 56)" d="M46 110C20 106 0 84 0 56C0 33 14 12 35 3C48-2 60 4 62 16C66 29 57 39 44 39C36 39 28 35 23 28C11 38 5 51 7 65C9 86 24 103 46 109Z"/></svg>
      <span class="auth-band-word" aria-hidden="true">E<span>X</span>OM</span>
      <span class="auth-tagline-text">Panel de administración EXOM</span>
    </p>
  </div>

  <main class="auth-main" id="auth-main">
    <div class="auth-col">

      <!-- ============ FORM (form / validation / error / loading) ============ -->
      <div data-show="form validation error loading">
        <h1 class="h1 auth-h1">Iniciar sesión</h1>
        <p class="sr-only">Panel de administración EXOM</p>

        <form class="auth-form" id="login-form" novalidate aria-describedby="login-error">
          <div class="banner banner-danger" id="login-error" role="alert" data-show="error">
            <i data-lucide="circle-alert"></i>
            <span class="banner-text">Credenciales inválidas</span>
          </div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" placeholder="admin@exom.app" autocomplete="email" inputmode="email" required>
          </div>

          <div>
            <div class="field">
              <label class="field-label" for="password">Contraseña</label>
              <div class="pw-wrap">
                <input class="input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required>
                <button class="pw-toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="Mostrar contraseña">
                  <i data-lucide="eye" class="ic-show"></i><i data-lucide="eye-off" class="ic-hide"></i>
                </button>
              </div>
            </div>
            <div class="auth-row-end">
              <button class="auth-link" type="button" data-forgot data-busy-disable>¿Has olvidado tu contraseña?</button>
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-arrow btn-block" type="submit" data-label="Iniciar sesión" data-loading-label="Iniciando sesión...">
            <span class="btn-label">Iniciar sesión</span><i data-lucide="arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider" role="separator" aria-label="O continúa con"><span aria-hidden="true">O continúa con</span></div>

        <div class="auth-alt">
          <button class="btn btn-secondary btn-block" type="button" data-busy-disable>
            <svg class="g-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.94l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
            </svg>
            Google
          </button>
          <button class="btn btn-secondary btn-block btn-quiet" type="button" disabled aria-describedby="apple-soon">
            <svg class="g-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16.37 12.76c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.82-.81-3-.79-1.54.02-2.96.9-3.76 2.28-1.6 2.78-.41 6.9 1.15 9.16.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.78.74 2.99.72 1.24-.02 2.02-1.12 2.77-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.65zM14.1 6.02c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.27z"/></svg>
            Apple<span class="soon" id="apple-soon">· Próximamente</span>
          </button>
        </div>
      </div>

      <!-- ============ BLOCKED ACCOUNT (HTTP 423) ============ -->
      <section class="auth-blocked" data-show="blocked" aria-labelledby="blocked-title">
        <i data-lucide="lock"></i>
        <h1 class="h1 auth-h1" id="blocked-title" tabindex="-1">Cuenta bloqueada</h1>
        <p class="auth-lead">Tu cuenta ha sido desactivada. Contacta con el administrador del sistema.</p>
        <div class="auth-actions">
          <a class="btn btn-primary btn-lg" href="mailto:soporte@exom.app">Contactar entrenador</a>
          <button class="btn btn-secondary btn-lg" type="button" data-auth-state="form">Volver</button>
        </div>
      </section>

    </div>
  </main>
</div>
<script src="assets/pages/login.js"></script>
</body>
</html>
